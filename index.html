<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قارئ الفصول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="menuBtn" aria-label="قائمة الفصول">☰</button>
    <h1 id="bookTitle">قارئ الفصول</h1>
    <div class="tools">
      <button id="fontMinus" aria-label="تصغير الخط">أ-</button>
      <button id="fontPlus" aria-label="تكبير الخط">أ+</button>
      <button id="themeBtn" aria-label="تبديل الوضع">🌓</button>
    </div>
  </header>

  <aside id="sidebar" class="hidden"><ul id="chapterList"></ul></aside>

  <main>
    <h2 id="chapterTitle"></h2>
    <article id="content">جاري التحميل...</article>
    <nav class="pager">
      <button id="prevBtn">→ السابق</button>
      <button id="nextBtn">التالي ←</button>
    </nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
